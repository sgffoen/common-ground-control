channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.8
  - compas
  - compas_fab
  - matplotlib
  - numpy
  - opencv
  - scikit-learn
  - ipython
  - pip
  - pip:
    # code style tools
    - flake8
    - autopep8
    - pylint
    - isort
    # testing tools
    - pytest
    - ironpython-pytest
    # autocomplete for Rhino
    - Rhino-stubs
    - Grasshopper-stubs
    - tensorflow
    - open3d